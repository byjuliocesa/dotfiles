set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 0
set -g renumber-windows on

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Toda cópia do tmux (arrastar o mouse, duplo clique, y) vai para a área de transferência.
set -s copy-command 'wl-copy'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Cores do wallpaper, geradas pelo Caelestia
source-file -q ~/.local/state/caelestia/theme/tmux.conf

# Sessões que sobrevivem a reboot e crash: o continuum salva a cada 5 min
# e restaura tudo quando o servidor do tmux sobe. Salvo em ~/.local/share/tmux/resurrect.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# Precisa ser a última linha.
run -b '~/.config/tmux/plugins/tpm/tpm'
