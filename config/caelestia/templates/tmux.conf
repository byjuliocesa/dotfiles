set -g status-style "bg=#{{ surfaceContainer.hex }},fg=#{{ onSurface.hex }}"
set -g status-left "#[bg=#{{ primary.hex }},fg=#{{ onPrimary.hex }},bold] #S #[default] "
set -g status-right "#[fg=#{{ onSurfaceVariant.hex }}]%H:%M "
set -g window-status-style "fg=#{{ onSurfaceVariant.hex }}"
set -g window-status-current-style "fg=#{{ primary.hex }},bold"
set -g pane-border-style "fg=#{{ outlineVariant.hex }}"
set -g pane-active-border-style "fg=#{{ primary.hex }}"
set -g message-style "bg=#{{ surfaceContainerHigh.hex }},fg=#{{ onSurface.hex }}"
set -g mode-style "bg=#{{ primaryContainer.hex }},fg=#{{ onPrimaryContainer.hex }}"
